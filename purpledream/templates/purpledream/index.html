{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple Dream - Cardápio do Dia</title>
    <style>
        * {
            margin: 0 ;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background:#c881f5 (298, 75%, 30%);
            min-height: 100vh;
        }

        /* Fundo com imagem de bolo igual mockup */
        .hero {
           
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Menu topo roxo */
        nav {
            position: absolute;
            top: 0;
            width: 100%;
            
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: rgb(7, 6, 6);
            font-family: 'Brush Script MT', cursive;
        }

        .menu {
            display: flex;
            gap: 35px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        .btn-whatsapp {
            border: 2px solid white;
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        /* Título Cardápio do Dia */
        .hero h1 {
            font-size: 56px;
            color: #a35fce;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    
        }

        .hero p {
            color: #1a1717;
            font-size: 16px;
            text-align: center;
            max-width: 600px;
            opacity: 0.9;
        }

        /* Caixa de Login com efeito vidro */
        .login-card {
            background: rgba(175, 10, 175, 0.664);
            backdrop-filter: blur(10px);
            padding: 40px 45px;
            border-radius: 20px;
            box-shadow: 0 20px 50px  #6a1b9a;
            width: 100%;
            max-width: 420px;
            margin-top: 40px;
        }

        .login-card h3 {
            text-align: center;
            color: #6a1b9a;
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .login-card label {
            display: block;
            color: #6a1b9a;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .login-card input {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid hwb(280 93% 5%);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            outline: none;
        }

        .login-card input:focus {
            border-color: #6a1b9a;
        }

        .btn-entrar {
            width: 100%;
            background: #6a1b9a;
            color: hsla(320, 51%, 19%, 0.493);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-entrar:hover {
            background: #4a148c;
        }

        /* Seção Mais Vendidos roxa */
        .mais-vendidos {
            background: #6a1b9a;
            padding: 60px 50px 80px;
            text-align: center;
        }

        .mais-vendidos h2 {
            color: #cd9ddb;
            font-size: 32px;
            margin-bottom: 50px;
            font-weight: 600;
        }

        .grid-doces {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .doce-item {
            background: rgb(12, 11, 11);
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .doce-item:hover {
            transform: translateY(-8px);
        }

        .doce-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .btn-encomendar {
            background: #6a1b9a;
            color: rgb(12, 11, 12);
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 15px;
            color: #f2f2f2;
        }

        @media (max-width: 768px) {
            .grid-doces { grid-template-columns: repeat(2, 1fr); }
            nav { flex-direction: column; gap: 15px; }
            .hero h1 { font-size: 38px; }
        }
</style>
</head>
<body>

    <section class="hero">
        <nav>
            <div class="logo">Purple DREAM</div>
            <div class="menu">
        
            </div>
        </nav>  

    <section>
        <h1>Cardápio do Dia</h1>
        <p>Faça seu pedido online e retire na loja ou receba em casa</p>
        <img src="cardapio.png" alt="">
    </section>

       
    </section>

    <section class="mais-vendidos">
        <h2>Mais Vendidos</h2>
        <div class="grid-doces">
            <div class="doce-item">
                 <img src="{% static 'purpledream/img/morango.jpg' %}" alt="Trufas">
                <button class="btn-encomendar">Encomendar</button>
            </div>
            <div class="doce-item">
                 <img src="{% static 'purpledream/img/maracujamussi.jpg' %}" alt="mussi">
                <button class="btn-encomendar">Encomendar</button>
            </div>
            <div class="doce-item">
                 <img src="{% static 'purpledream/img/prestigio.jpg' %}" alt="bolopote">
                <button class="btn-encomendar">Encomendar</button>
            </div>
            <div class="doce-item">
                  <img src="{% static 'purpledream/img/brigadeiro.jpg' %}" alt="Trufas">
                <button class="btn-encomendar">Encomendar</button>
            </div>
             
     </section> 
            
     <section>

    <section class="hero">
        <nav>
                <a href="#"><button class="btn-encomendar">Localização</button></a>
                  <img src="{% static 'purpledream/img/celular de localização.png' %}" alt="">
                <a href="#"><button class="btn-encomendar">Contato</button></a> 
                <a href="{% url 'purpledream:cardapio' %}" class=""><button class="btn-encomendar">Fazer Pedido</button></a>
                  
        <nav>
            </div>
    
    </section>
          </div>
               
           </div>
    </section>

</body>
</html>
