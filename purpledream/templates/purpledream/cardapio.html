{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>
</head>
<body> 
    <style>
    /* Seção Mais Vendidos roxa */
    .mais-vendidos {
        background: #b57ada;
        padding: 60px 50px 80px;
        text-align: center;
    }

    .mais-vendidos h1 {
        color: rgb(226, 226, 226);
        font-size: 32px;
        margin-bottom: 50px;
        font-weight: 600;
    }

    .grid-doces {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .doce-item {
        background: #65278b;
        border-radius: 15px;
        overflow: hidden;
        transition: 0.3s;
        width: 220px;
        display: flex;
        flex-direction: column;
    }

    .doce-item:hover {
        transform: translateY(-8px);
    }

    .doce-item img {
        width: 100%;
        height: 160px;
        object-fit: cover;
    }

    .btn-encomendar {
        background: #65278b;
        color: #ffffffff;
        border: none;
        width: 100%;
        padding: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .grid-doces { gap: 20px; }
        .doce-item { width: calc(50% - 20px); }
        nav { flex-direction: column; gap: 15px; }
        .hero h1 { font-size: 38px; }
    }

    @media (max-width: 480px) {
        .doce-item { width: 100%; }
    }
</style>
</head>
<body>
    <div style="padding: 20px 40px; background: #fff; display: flex; justify-content: space-between; align-items: center;">
        <strong style="color: #65278b;">Purple Dreams</strong>
        <nav style="display: flex; gap: 20px;">
            <a href="{% url 'purpledream:home' %}" style="color: #65278b; text-decoration: none;">Home</a>
            <a href="{% url 'purpledream:catalogo' %}" style="color: #65278b; text-decoration: none;">Catálogo</a>
            <a href="{% url 'purpledream:carrinho' %}" style="color: #65278b; text-decoration: none;">Carrinho</a>
            <a href="{% url 'purpledream:login' %}" style="color: #65278b; text-decoration: none;">Login</a>
        </nav>
    </div>
    <section class="mais-vendidos">
        <h1>Cardápio</h1>
        <div class="grid-doces">
            <div class="doce-item">
                <img src="{% static 'purpledream/img/trufa.png' %}" alt="Trufas">
                <button class="btn-encomendar">trufa Beijinho </button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/maracuja.jpg' %}" alt="Trufas">
                <button class="btn-encomendar ">trufa Maracuja</button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/limao.jp' %}g"alt="Trufas">
                <button class="btn-encomendar ">trufa limao</button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/morango.jpg' %}" alt="Trufas">
                <button class="btn-encomendar ">trufa Morango</button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/Ninho.jpg' %}" alt="bolopote">
                <button class="btn-encomendar">bolo de pote Ninho</button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/bolobrigadeiro.jpg' %}" alt="bolopote">
                <button class="btn-encomendar ">bolo de pote Chocolate </button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/bolo de choc.pn' %}g"alt="bolopote">
                <button class="btn-encomendar">bolo de pote Brigadeiro</button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/prestigio.jpg' %}" alt="bolopote">
                <button class="btn-encomendar">bolo de pote Prestigio</button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/mussi.jpg' %}" alt="Trufas">
                <button class="btn-encomendar">mussi de limao</button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/maracujamussi.jpg' %}" alt="mussi">
                <button class="btn-encomendar ">Mussi de maracuja</button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/beijinho.jp' %}g"alt="Bolo">
                <button class="btn-encomendar">beijinho</button>
            </div>
            <div class="doce-item">
                <img src="{% static 'purpledream/img/brigadeiro.jpg' %}" alt="Trufas">
                <button class="btn-encomendar ">Brigadeiro </button>
            </div>
        </div>
    </section>
</body>
</html>
