<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>
</head>
<body> 
    <style>
    /* Seção Mais Vendidos roxa */
    .mais-vendidos {
        background: #6a1b9a;
        padding: 60px 50px 80px;
        text-align: center;
    }

    .mais-vendidos h1 {
        color: rgb(198, 131, 204);
        font-size: 32px;
        margin-bottom: 50px;
        font-weight: 600;
    }

    .grid-doces {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
        max-width: 1100px;
        margin: 0 auto;
    }

    .doce-item {
        background: rgb(24, 23, 23);
        border-radius: 15px;
        overflow: hidden;
        transition: 0.3s;
    }

    .doce-item:hover {
        transform: translateY(-8px);
    }

    .doce-item img {
        width: 100%;
        height: 160px;
        object-fit: cover;
    }

    .btn-encomendar {
        background: #6a1b9a;
        color: rgb(7, 7, 7);
        border: none;
        width: 100%;
        padding: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .grid-doces { grid-template-columns: repeat(2, 1fr); }
        nav { flex-direction: column; gap: 15px; }
        .hero h1 { font-size: 38px; }
    }
</style>
</head>
<body>
    <section class="mais-vendidos">
        <h1>Cardápio</h1>
        <div class="grid-doces">
            <div class="doce-item">
                <img src="trufa.png" alt="Trufas">
                <button class="btn- trufa Beijinho  ">trufa Beijinho </button>
            </div>
            <div class="doce-item">
                <img src="maracuja.jpg" alt="Trufas">
                <button class="btn-trufa Maracuja ">trufa Maracuja</button>
            </div>
            <div class="doce-item">
                <img src="limao.jpg"alt="Trufas">
                <button class="btn-trufa limao ">trufa limao</button>
            </div>
            <div class="doce-item">
                <img src="morango.jpg" alt="Trufas">
                <button class="btn-trufa Morango ">trufa Morango</button>
            </div>
            <div class="doce-item">
                <img src="Ninho.jpg" alt="bolopote">
                <button class="btn-bolo de pote ninho">bolo de pote Ninho</button>
            </div>
            <div class="doce-item">
                <img src="bolobrigadeiro.jpg" alt="bolopote">
                <button class="btn-bolo de pote Chocolate ">bolo de pote Chocolate </button>
            </div>
            <div class="doce-item">
                <img src="bolo de choc.png"alt="bolopote">
                <button class="btn- bolo de pote Brigadeiro">bolo de pote Brigadeiro</button>
            </div>
            <div class="doce-item">
                <img src="prestigio.jpg" alt="bolopote">
                <button class="btn- bolo de pote Prestigio">bolo de pote Prestigio</button>
            </div>
            <div class="doce-item">
                <img src="mussi.jpg" alt="Trufas">
                <button class="btn-mussi de limao">mussi de limao</button>
            </div>
            <div class="doce-item">
                <img src="maracujamussi.jpg" alt="mussi">
                <button class="btn-Mussi de maracuja">Mussi de maracuja</button>
            </div>
            <div class="doce-item">
                <img src="beijinho.jpg"alt="Bolo">
                <button class="btn-beijinho">beijinho</button>
            </div>
            <div class="doce-item">
                <img src="brigadeiro.jpg" alt="Trufas">
                <button class="btn-Brigadeiro ">Brigadeiro </button>
            </div>
        </div>
    </section>
</body>
</html>racuja
